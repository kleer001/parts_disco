  - contentinfo [ref=f12e73]:
    - paragraph [ref=f12e74]:
      - text: Every view is drawn at one scale, so a van reads bigger than a sedan and a front view reads narrower than a side. Four of the twelve bodies —
      - code [ref=f12e75]: sedan
      - text: ","
      - code [ref=f12e76]: sedan-sports
      - text: ","
      - code [ref=f12e77]: taxi
      - text: ","
      - code [ref=f12e78]: police
      - text: — are the same shell with different trim, and from the front they differ by a roof sign or a light bar and nothing else.
    - paragraph [ref=f12e79]: Which is why density turns out not to be the difficulty. A tractor is found instantly at any count; a taxi is hard at any count. What decides a round is which vehicle is asked for and how many of its near-twins are on the board with it.