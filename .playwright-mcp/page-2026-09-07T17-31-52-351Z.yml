  - contentinfo [ref=f6e77]:
    - paragraph [ref=f6e78]:
      - text: Every view is drawn at one scale, so a van reads bigger than a sedan and a front view reads narrower than a side. Four of the twelve bodies —
      - code [ref=f6e79]: sedan
      - text: ","
      - code [ref=f6e80]: sedan-sports
      - text: ","
      - code [ref=f6e81]: taxi
      - text: ","
      - code [ref=f6e82]: police
      - text: — are the same shell with different trim, and from the front they differ by a roof sign or a light bar and nothing else.
    - paragraph [ref=f6e83]: Which is why density turns out not to be the difficulty. A tractor is found instantly at any count; a taxi is hard at any count. What decides a round is which vehicle is asked for and how many of its near-twins are on the board with it.