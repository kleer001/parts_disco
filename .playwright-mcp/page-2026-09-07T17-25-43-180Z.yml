      - text: ","
      - code [ref=f4e72]: sedan-sports
      - text: ","
      - code [ref=f4e73]: taxi
      - text: ","
      - code [ref=f4e74]: police
      - text: — are the same shell with different trim, and from the front they differ by a roof sign or a light bar and nothing else.
    - paragraph [ref=f4e75]: Which is why density turns out not to be the difficulty. A tractor is found instantly at any count; a taxi is hard at any count. What decides a round is which vehicle is asked for and how many of its near-twins are on the board with it.